name: Feature request
description: Suggest a new skill, hook improvement, or MCP server addition
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Describe what you want and why.

  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - New skill
        - Hook improvement
        - New MCP server stub
        - Dependency addition
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What workflow pain does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? A rough sketch is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds exist today?
