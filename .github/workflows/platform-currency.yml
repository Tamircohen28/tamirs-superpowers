name: Platform Currency

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: Probe upstream platform versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Probe platform versions
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # Resolve the Codex release with this workflow's token: unauthenticated calls
          # hit the shared per-IP limit on hosted runners and read "unreachable". Done
          # here, not in the probe script, because that script ships with the plugin and
          # must never read a credential. Empty on failure: the script then falls back to
          # an unauthenticated call and reports its HTTP status.
          CODEX_RELEASE_TAG="$(gh api repos/openai/codex/releases/latest --jq .tag_name 2>/dev/null)"
          [ -n "$CODEX_RELEASE_TAG" ] || echo "::warning::authenticated Codex release lookup failed; probe falls back to an unauthenticated call"
          export CODEX_RELEASE_TAG
          output="$(bash scripts/probe-platform-versions.sh . 2>&1)"
          exit_code=$?
          echo "$output"
          {
            echo "output<<PROBE_EOF"
            echo "$output"
            echo "PROBE_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $exit_code
        continue-on-error: true

      # One open issue per drift, not one per night: while a `platform-drift` issue is
      # open, later runs comment the fresh probe output on it instead of filing a new
      # issue (13 dated duplicates, #417–#434, piled up before this).
      - name: Open or update drift issue
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBE_OUTPUT: ${{ steps.probe.outputs.output }}
        run: |
          body="$(cat <<ISSUE_EOF
          The nightly platform-currency probe ($(date -u +%Y-%m-%d)) found at least one
          platform whose upstream version no longer matches the pin in
          \`docs/engineering/build-and-release/platform-targets.json\`.

          \`\`\`
          $PROBE_OUTPUT
          \`\`\`

          Run \`bash scripts/probe-platform-versions.sh .\` locally to confirm,
          then update the drifted platform's \`latest_known\` (and any
          dependent narrative docs) accordingly.
          ISSUE_EOF
          )"
          gh label create platform-drift --force --color D93F0B \
            --description "Nightly platform-currency probe found version drift" >/dev/null
          existing="$(gh issue list --state open --label platform-drift --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Platform version drift detected" \
              --label platform-drift --body "$body"
          fi

      - name: Fail the job if drift was detected
        if: steps.probe.outcome == 'failure'
        run: exit 1
