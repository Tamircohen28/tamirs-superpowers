name: Repository description

# Writes the GitHub repository description so it names the skill and agent counts the
# tree ships (scripts/check-repo-description.sh --fix). CI's static-and-docs job only
# WARNS on drift, because the Actions GITHUB_TOKEN cannot change repository settings.
# The write (PATCH /repos/{owner}/{repo}) needs a token with Administration: write on
# the repository (fine-grained PAT) or the classic `repo` scope: that is the secret
# REPO_ADMIN_TOKEN. RELEASE_PUSH_TOKEN, the token release.yml moves tags with, is the
# fallback because it only has to be Contents: write (directory-distribution.md), so
# with it alone the write can fail with 403 — the job then fails and says so, never
# passes having written nothing. Dispatched by hand, and after every release so the
# description follows the tree without anyone remembering it.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  sync:
    name: Description names the shipped counts
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
      - name: Write the description from the tree
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN || secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Neither REPO_ADMIN_TOKEN nor RELEASE_PUSH_TOKEN is set; the Actions token cannot change repository settings."
            exit 1
          fi
          bash scripts/check-repo-description.sh . --fix
