name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# Supersede in-flight runs for the same PR; never cancel a push to a release branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: make lint
      - name: Check for orphan hook scripts
        run: |
          if [ -d hooks ] && [ -f hooks/hooks.json ]; then
            find hooks -maxdepth 1 -name '*.sh' | while read f; do
              base=$(basename "$f")
              grep -q "$base" hooks/hooks.json || { echo "WARN: $f not referenced in hooks.json"; }
            done
          else
            echo "hooks/ absent — skipping"
          fi

  # `make validate` is split three ways so the gate answers in minutes instead of half
  # an hour, without changing the required status-check context. The suites
  # (`make test-hooks`) run as a six-shard matrix; everything else in the gate runs
  # once in `validate-rest`; and `full-validate` keeps the name that
  # config/github/repository-policy.json requires, as an aggregator that is green only
  # when both are. Shard model: docs/engineering/build-and-release/testing-matrix.md.
  validate-shards:
    name: make test-hooks (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: skills/repo/_contract/fixtures/scaffold-plugin-gold/.nvmrc
      - name: Install validation dependencies
        run: |
          sudo apt-get install -y shellcheck
          pip install -r scripts/requirements-validate.txt
      - name: Run this shard of the suites
        run: make test-hooks SHARD=${{ matrix.shard }}/6

  validate-rest:
    name: make validate minus the suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: skills/repo/_contract/fixtures/scaffold-plugin-gold/.nvmrc
      - name: Install validation dependencies
        run: |
          sudo apt-get install -y shellcheck
          pip install -r scripts/requirements-validate.txt
      # `-o test-hooks` tells make to treat that one prerequisite as already up to date,
      # so this is `make validate` exactly -- same prerequisite list, same recipe body
      # (JSON parse, frontmatter, orphan hooks) -- minus the target the matrix runs.
      # Nothing here restates the Makefile, so nothing here can drift from it.
      - name: Run every part of the gate except test-hooks
        run: make -o test-hooks validate

  full-validate:
    # The required status-check context. It owns no work of its own any more: it is
    # green only when every shard and the rest of the gate are, and it runs on
    # `always()` so a failed or cancelled dependency still produces a red check here
    # rather than a context that never reports (which would block every merge).
    name: make validate (full local-parity gate)
    runs-on: ubuntu-latest
    needs: [validate-shards, validate-rest]
    if: always()
    steps:
      - name: Every part of the gate passed
        env:
          SHARDS: ${{ needs.validate-shards.result }}
          REST: ${{ needs.validate-rest.result }}
        run: |
          echo "validate-shards: $SHARDS"
          echo "validate-rest:   $REST"
          if [ "$SHARDS" = success ] && [ "$REST" = success ]; then
            echo "make validate passed in full"
          else
            echo "::error::make validate did not pass in full (shards=$SHARDS rest=$REST)"
            exit 1
          fi

  orchestration-tests:
    name: Orchestration simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Simulate objective -> workers -> integration -> one PR
        run: bash tests/test-orchestration.sh

  skill-contract:
    name: Skill contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PyYAML
        run: pip install -r scripts/requirements-validate.txt
      - name: Assert the portable skill contract
        run: bash tests/test-skill-contract.sh
      # Every warning the contract can raise is a failure here: a warning that is allowed
      # to persist is a check that stopped checking (docs/engineering/architecture/validation-tiers.md).
      - name: Assert the skill contract strictly
        run: bash tests/test-skill-contract.sh --strict
      # The Agent Skills reference validator (npx skills-ref), with this repo's two known
      # divergences (Claude extension fields; the compatibility map) classified and every
      # other finding fatal. Skips itself only when the npm registry is unreachable.
      - name: Hold every SKILL.md to the Agent Skills reference validator
        run: bash scripts/check-skills-ref.sh .

  static-and-docs:
    name: Static repo + docs tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Static repository tests
        run: bash tests/test-static.sh
      - name: Documentation tests
        run: bash tests/test-docs.sh
      # The GitHub repository description lives outside the tree and is set by hand; it
      # must name the skill and agent counts the tree ships. Drift is a workflow warning
      # with the exact `gh repo edit` command, never a failure: no commit can fix it, so
      # a red check here would only hide the next real failure behind a known one.
      - name: Repository description names the shipped counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-repo-description.sh . --warn

  platform-contract:
    name: Platform contract (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [gemini, opencode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PyYAML
        run: pip install -r scripts/requirements-validate.txt
      # The platform CLIs are absent on ubuntu-latest, so each suite runs its
      # always-on schema/contract half and skips the live-CLI half with a notice.
      - name: Contract assertions
        run: bash tests/test-${{ matrix.platform }}-adapter.sh

  # `hook-tests` (make test-hooks) stood here and was removed. `validate-shards` now
  # runs every tests/test-*.sh that job ran, across six shards behind the
  # full-validate aggregator. Measured on a full run it was the most expensive
  # duplicate in this workflow -- 249s against full-validate's 295s -- so it bought a
  # 46-second head start on a five-minute gate at the price of a whole runner.
  #
  # The cheap standalone jobs below and above (6-47s) are duplicates too and were kept
  # on purpose: they return an answer minutes before full-validate can, which is the
  # only thing that makes a duplicated job worth its runner. Four of them are also
  # required status checks, so removing them would block every PR on a context that
  # never reports.

  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate all JSON files
        run: |
          find . -name '*.json' -not -path '*/.git/*' | while read f; do
            jq empty "$f" || { echo "Invalid JSON: $f"; exit 1; }
          done

  validate-skills:
    name: Validate SKILL.md frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate portable + tamirs + claude frontmatter tiers
        run: python3 scripts/validate-skill-frontmatter.py


  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan for high-signal secret patterns
        run: |
          if grep -rE \
            '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xoxb-[0-9]+-|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)' \
            --include='*.sh' --include='*.json' --include='*.md' --include='*.yml' \
            --exclude-dir='.git' .; then
            echo "Potential secrets found — review before merging"
            exit 1
          fi
          echo "No secrets found"

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run claude plugin validate (marketplace manifest)
        run: claude plugin validate .
      # The `.` form validates only the marketplace manifest and never reads the hooks
      # module. The plugin-manifest form does, and `claude plugin test` runs the mod's own
      # tests against the engine (mod/*.test.tsx). See docs/engineering/architecture/mods.md.
      - name: Validate and test the mod (mod)
        run: make test-mods
      # The always-on token cost the host charges every session for this plugin, measured
      # by `claude --plugin-dir . plugin details` on this checkout and held to the committed
      # baseline in evals/budget.json (ceiling and tolerance). This runner's CLI has no
      # credentials, so it prints a chars/4 fallback (~30% low, issue #401); the script
      # recognises that figure and holds the offline estimate from scripts/always-on-cost.py
      # instead, which needs PyYAML. The same offline check also runs in every shard through
      # tests/test-skill-budget.sh.
      - name: Install PyYAML
        run: python3 -m pip install -q -r scripts/requirements-validate.txt
      - name: Hold the always-on token cost to its budget
        run: bash scripts/check-token-budget.sh .

  claude-dist:
    # The Claude-only distribution Anthropic's plugin directory tracks (tag `claude`,
    # moved by release.yml) is generated from this tree. Build it here on every change
    # and hold it to the directory's own rules, so a change that would block or hold
    # the listing fails on the pull request, not at release.
    # See docs/engineering/build-and-release/directory-distribution.md.
    name: Claude-only distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Install PyYAML
        run: python3 -m pip install -q -r scripts/requirements-validate.txt
      - name: Build and check the distribution
        run: |
          bash scripts/build-claude-dist.sh "$RUNNER_TEMP/claude-dist" --quiet
          bash scripts/check-claude-dist.sh "$RUNNER_TEMP/claude-dist"

  host-dists:
    # Every other host's subset (docs/engineering/build-and-release/distributions.md):
    # built by the same generator, held to each host's own parser rules, so a change
    # that Codex, Cursor, Gemini, Antigravity, OpenCode or an Agent Plugins client would reject
    # fails on the pull request. The release workflow attaches these as assets.
    name: Per-host distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PyYAML
        run: python3 -m pip install -q -r scripts/requirements-validate.txt
      - name: Generated files are current (manifests, Codex hooks and agents, Cursor rules, Gemini hooks, Antigravity plugin, .agents/skills)
        run: |
          bash scripts/build-manifests.sh . --check
          bash scripts/build-codex-hooks.sh . --check
          bash scripts/build-codex-agents.sh . --check
          bash scripts/build-cursor-rules.sh . --check
          bash scripts/build-gemini-hooks.sh . --check
          bash scripts/build-antigravity-plugin.sh . --check
          bash scripts/build-agents-skills.sh . --check
      - name: Build and check every target
        run: make check-dists
      - name: Planted-finding probes
        run: bash tests/test-dist.sh

  contract-test:
    name: Repo contract (scaffold-gold)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: skills/repo/_contract/fixtures/scaffold-plugin-gold/.nvmrc
      - name: Assert contract fixtures (app-gold + plugin-gold)
        run: make test-repo-contract

  contract-assert:
    # The job above asserts the gold FIXTURES. This one asserts THIS repo against the
    # same standards contract. `make assert-contract` has always existed and no workflow
    # has ever invoked it, so the one gate that scores this repo could never block a
    # merge. The inventory's GitHub-settings probe is unauthenticated here, so those
    # facts come from the filesystem only; a local run with `gh` logged in checks more.
    name: Repo contract (this repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PyYAML
        run: pip install -r scripts/requirements-validate.txt
      - name: Assert this repo against its own standards contract
        run: make assert-contract

  manifest-version-alignment:
    name: Manifest/tag version alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check manifest versions
        run: |
          ARGS="."
          case "${{ github.event_name }}" in
            pull_request)
              # The tag for a proposed bump cannot exist yet — manifests only.
              ARGS+=" --manifests-only" ;;
            push)
              # A version-bumping merge lands on master before the release
              # workflow can tag it, so "manifest ahead" is a pending release,
              # not drift. Warns instead of failing; moving backwards still fails.
              ARGS+=" --allow-pending-release" ;;
          esac
          bash skills/repo/_contract/scripts/check-manifest-version-alignment.sh $ARGS

  platform-targets:
    name: Platform targets co-change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require platform-targets.json when repo skills change
        run: make platform-targets-cochange

  hol-scanner:
    name: HOL Plugin Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pipx
        run: pip install pipx && pipx ensurepath
      - name: Lint plugin structure
        run: pipx run plugin-scanner lint .
      - name: Verify plugin publish-readiness
        # `verify` reports FAIL whenever it skips executing an MCP stdio server, which it
        # always does in CI for safety (classification "safety-skip"), and this plugin ships
        # one (`github`). Gate on every other check rather than ignoring the step: a
        # continue-on-error here left a permanent red annotation and could never fail.
        run: |
          pipx run plugin-scanner verify . --format json > verify.json || true
          jq -e '.cases | length > 0' verify.json >/dev/null \
            || { echo "::error::plugin-scanner verify wrote no cases"; cat verify.json; exit 1; }
          jq -r '.cases[] | "\(if .passed then "ok  " elif .classification == "safety-skip" then "skip" else "FAIL" end) \(.component): \(.name) - \(.message)"' verify.json
          bad=$(jq '[.cases[] | select(.passed != true and .classification != "safety-skip")] | length' verify.json)
          [ "$bad" -eq 0 ] || { echo "::error::plugin-scanner verify: $bad check(s) failed"; exit 1; }
