name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck on hook scripts
        run: find hooks -name '*.sh' | xargs shellcheck -S warning --exclude SC2034
      - name: Check for orphan hook scripts
        run: |
          find hooks -maxdepth 1 -name '*.sh' | while read f; do
            base=$(basename "$f")
            grep -q "$base" hooks/hooks.json || { echo "WARN: $f not referenced in hooks.json"; }
          done

  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Validate all JSON files
        run: |
          find . -name '*.json' -not -path '*/.git/*' | while read f; do
            jq empty "$f" || { echo "Invalid JSON: $f"; exit 1; }
          done

  validate-skills:
    name: Validate SKILL.md frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate all official frontmatter fields
        run: python3 scripts/validate-skill-frontmatter.py


  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Scan for high-signal secret patterns
        run: |
          if grep -rE \
            '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xoxb-[0-9]+-|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)' \
            --include='*.sh' --include='*.json' --include='*.md' --include='*.yml' \
            --exclude-dir='.git' .; then
            echo "Potential secrets found — review before merging"
            exit 1
          fi
          echo "No secrets found"

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run claude plugin validate
        run: claude plugin validate .

  contract-test:
    name: Repo contract (scaffold-gold)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: skills/repo/_contract/fixtures/scaffold-plugin-gold/.nvmrc
      - name: Assert contract fixtures (app-gold + plugin-gold)
        run: make test-repo-contract

  hol-scanner:
    name: HOL Plugin Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install pipx
        run: pip install pipx && pipx ensurepath
      - name: Lint plugin structure
        run: pipx run plugin-scanner lint .
      - name: Verify plugin publish-readiness
        # MCP stdio execution is intentionally skipped by the scanner in CI for
        # safety — this warning is unavoidable for plugins that ship MCP servers.
        continue-on-error: true
        run: pipx run plugin-scanner verify .
