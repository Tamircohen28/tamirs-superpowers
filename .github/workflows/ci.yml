name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck on hook scripts
        run: find hooks -name '*.sh' | xargs shellcheck -S warning --exclude SC2034
      - name: Check for orphan hook scripts
        run: |
          find hooks -maxdepth 1 -name '*.sh' | while read f; do
            base=$(basename "$f")
            grep -q "$base" hooks/hooks.json || { echo "WARN: $f not referenced in hooks.json"; }
          done

  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate all JSON files
        run: |
          find . -name '*.json' -not -path '*/.git/*' | while read f; do
            jq empty "$f" || { echo "Invalid JSON: $f"; exit 1; }
          done

  validate-skills:
    name: Validate SKILL.md frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check name + description fields
        run: |
          failed=0
          find skills -name 'SKILL.md' | while read f; do
            grep -q '^name:' "$f" || { echo "MISSING name: in $f"; failed=1; }
            grep -q '^description:' "$f" || { echo "MISSING description: in $f"; failed=1; }
          done
          exit $failed

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan for high-signal secret patterns
        run: |
          if grep -rE \
            '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xoxb-[0-9]+-|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)' \
            --include='*.sh' --include='*.json' --include='*.md' --include='*.yml' \
            --exclude-dir='.git' .; then
            echo "Potential secrets found — review before merging"
            exit 1
          fi
          echo "No secrets found"

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run claude plugin validate
        run: claude plugin validate .
