# Adapter metadata — OpenCode (REFACTOR-SPEC §21).
# Thin pointer file. Authoritative capabilities: core/capabilities/platforms.json.
id: opencode
display_name: OpenCode
registry_key: opencode

# Coarse summary only. `agents` is the registry's `subagents` key.
capabilities:
  skills: native
  agents: adapter
  hooks: unsupported
  mcp: native

# OpenCode has no plugin manifest; opencode.json is the project config.
manifest: opencode.json

install:
  type: path
  doc: docs/user/install/opencode.md

validation:
  command: opencode debug skill

notes: >-
  skills is `native` — the canonical skills/ tree is read in place via
  opencode.json `skills.paths`, with no copying. agents is `adapter` because
  OpenCode's agent frontmatter genuinely differs from the canonical shape;
  .opencode/agent/ is generated by scripts/build-opencode-agents.sh and drift is
  enforced by `make opencode-agents-check`. hooks is `unsupported`: OpenCode's only
  lifecycle mechanism is the JS/TS plugin API, and this repo ships no plugin module
  by design (it would add a Node runtime dependency for no other gain), so the
  hooks/ guards do not run at all. They are enforced in CI instead.
