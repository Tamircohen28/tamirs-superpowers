# Adapter metadata — OpenCode (REFACTOR-SPEC §21).
# Thin pointer file. Authoritative capabilities: core/capabilities/platforms.json.
id: opencode
display_name: OpenCode
registry_key: opencode

# Coarse summary only. `agents` is the registry's `subagents` key.
capabilities:
  skills: native
  agents: adapter
  hooks: adapter
  mcp: native

# OpenCode has no plugin manifest; opencode.json is the project config.
manifest: opencode.json

install:
  type: path
  doc: docs/user/install/opencode.md

validation:
  command: bash tests/test-opencode-v2.sh

notes: >-
  OpenCode 2 only (@opencode/cli; 1.x is not supported; migrate with https://opencode.ai/v2/docs/migrate-v1/).
  skills is `native` — the canonical skills/ tree is read in place via the
  opencode.json `skills` array (paths resolve from the working directory, so
  start OpenCode at the repo root or use an absolute path in your global
  config). agents is `adapter`: OpenCode 2's agent frontmatter genuinely
  differs (no `tools`, an ordered `permissions` ruleset, `mode: subagent`
  explicit, provider-prefixed `model`); .opencode/agents/ is generated by
  scripts/build-opencode-agents.sh and drift is enforced by `make
  opencode-agents-check`. hooks is `adapter`: OpenCode runs no shell hook, so
  the three core guards (worktree edits under an objective, protected paths,
  force push / push to a branch another agent holds) are a V2 server plugin,
  platforms/opencode/plugin/ (index.ts -> guard.ts), registered under
  opencode.json `plugins[]` with a TUI plugin (tui.ts -> tui.tsx: status line,
  objective pane) from the same directory. The plugin LOADS on 2.0.32
  (`opencode plugin list`); its denies stopping an action live is unverified.
  mcp is `native`: opencode.json declares `mcp.servers.github` running
  scripts/github-mcp.sh with the token from GITHUB_PERSONAL_ACCESS_TOKEN.
