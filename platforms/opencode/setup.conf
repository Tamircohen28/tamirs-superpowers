# setup.conf — OpenCode target record for scripts/setup.sh. See platforms/claude/setup.conf.
# shellcheck shell=bash

SETUP_NAME="opencode"
SETUP_DISPLAY="OpenCode"

SETUP_DETECT="opencode"
SETUP_CONFIG_DIR="${XDG_CONFIG_HOME:-${HOME}/.config}/opencode"
SETUP_ENV_OVERRIDE="OPENCODE_CONFIG_DIR"

SETUP_MARKER="tamirs-superpowers"
SETUP_WRITERS="setup-opencode.sh"
SETUP_STATUS="implemented"

# NOTE: ~/.opencode/ is the binary, not config — nothing is written there.
# opencode.json asserts `$schema` only; `plugin` (cmux) and `mcp` are untouched.
SETUP_MODULES="agents-md config"
