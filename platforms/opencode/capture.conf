# capture.conf — OpenCode record for scripts/capture-config.sh.
# See platforms/claude/capture.conf for the field contract. Data only.
# shellcheck shell=bash

CAPTURE_NAME="opencode"
CAPTURE_DISPLAY="OpenCode"
CAPTURE_REGISTRY_KEY="opencode"

CAPTURE_MODULES="agents-md config"

CAPTURE_PORTABLE='$schema
model
small_model
theme
autoupdate
permission.*
permissions
instructions'

CAPTURE_MACHINE_LOCAL='provider.*.options.baseURL
provider.*.options.apiKey
providers.*.settings.baseURL
providers.*.settings.apiKey
share
username
projects.*'

# `plugin`/`plugins` and `mcp` are third-party wiring by construction: every
# entry names the package or server that owns it. Both the OpenCode 1 singular
# keys and the OpenCode 2 plural ones are listed, because a user's global config
# may still carry the V1 spelling (V2 reads both).
CAPTURE_THIRD_PARTY_KEYS='plugin
plugin.*
plugins
plugins.*
mcp.*'

CAPTURE_SINKS="$(printf '%s\t%s\t%s\n' \
  agents-md '*' core/global-rules.md \
  config    '*' platforms/opencode/templates/opencode.json)"
CAPTURE_SINK_CAPS="$(printf '%s\t%s\n' core/global-rules.md skill_auto_invocation)"
