# setup.conf — OpenAI Codex CLI target record for scripts/setup.sh. See platforms/claude/setup.conf.
# shellcheck shell=bash

SETUP_NAME="codex"
SETUP_DISPLAY="Codex CLI"

SETUP_DETECT="codex"
SETUP_CONFIG_DIR="${HOME}/.codex"
SETUP_ENV_OVERRIDE="CODEX_HOME"

SETUP_MARKER="tamirs-superpowers"
SETUP_WRITERS="setup-codex.sh"
SETUP_STATUS="implemented"

# `agents-md` first: it is the module that carries the rules, and config.toml only
# points at it. Codex stores a per-hook `trusted_hash` in config.toml, so the
# config module writes a comment-only block and never touches hook entries —
# see the header of scripts/lib/setup-codex.sh for why that is not a shortcut.
SETUP_MODULES="agents-md config"
