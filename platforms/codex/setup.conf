# setup.conf — OpenAI Codex CLI target record for scripts/setup.sh. See platforms/claude/setup.conf.
# shellcheck shell=bash

SETUP_NAME="codex"
SETUP_DISPLAY="Codex CLI"

SETUP_DETECT="codex"
SETUP_CONFIG_DIR="${HOME}/.codex"
SETUP_ENV_OVERRIDE="CODEX_HOME"

SETUP_MARKER="tamirs-superpowers"
SETUP_WRITERS=""
# Phase 3: ~/.codex/AGENTS.md + a marker block in ~/.codex/config.toml.
# Codex stores a per-hook `trusted_hash` in config.toml; the renderer must not
# touch hook entries or it silently invalidates wiring we do not own.
SETUP_STATUS="not-yet-implemented"
SETUP_MODULES=""
