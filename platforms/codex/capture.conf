# capture.conf — Codex CLI record for scripts/capture-config.sh.
# See platforms/claude/capture.conf for the field contract. Data only.
# shellcheck shell=bash

CAPTURE_NAME="codex"
CAPTURE_DISPLAY="Codex CLI"
CAPTURE_REGISTRY_KEY="codex"

# `config` is NOT captured. setup.sh writes a comment-only block there precisely
# because Codex stores a per-hook `trusted_hash` under [hooks.state.*] that is
# invalidated by any rewrite, and because a bare `key = value` appended to a TOML
# file binds to the last [table] rather than the document root. Reading settings
# back out of that file would need a TOML parser this repo does not have, and
# every value in it is one we have committed to not owning.
CAPTURE_MODULES="agents-md"

# Rules prose is portable by nature — that is the whole point of one canonical
# core/global-rules.md. The classifier still runs every line through the secret,
# third-party, absolute-path and IP gates first.
CAPTURE_PORTABLE='*'

CAPTURE_MACHINE_LOCAL='projects.*
*.trusted_hash
history.*'

CAPTURE_THIRD_PARTY_KEYS='hooks.*'

CAPTURE_SINKS="$(printf '%s\t%s\t%s\n' agents-md '*' core/global-rules.md)"
CAPTURE_SINK_CAPS="$(printf '%s\t%s\n' core/global-rules.md skill_auto_invocation)"
