[[rule]]
# no-force-push
# mirrors: core/policies/git.md: 'No force-push to base_branch or to a branch another task is working on'. Static form: no force-push anywhere; --force-with-lease is deliberately NOT matched (the next character after --force is '-', not whitespace or end), because a lease push is how pr-dev rebases its own branch.
