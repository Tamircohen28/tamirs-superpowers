commandRegex = '(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+|)(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+|)(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+|)(?:bash\s+|sh\s+|zsh\s+|)[^\s"]*capture-config\.sh\b.*?\s--adopt\S*(?=[\s"]|$)'
decision = "ask_user"
priority = 90
denyMessage = "tamirs-superpowers permission policy: capture-config --adopt stages machine config into the repository (config.policy.stage). It is an R4 action (ADR 004), never automatic at any level: it needs your approval at a host prompt, so with no one at the terminal it is denied."

[[rule]]
# plugin-config-write
# action: policy.edit (R4)
toolName = "run_shell_command"
commandRegex = '(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+|)(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+|)(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+|)(?:bash\s+|sh\s+|zsh\s+|)[^\s"]*plugin-config\.sh(?!\s+(?:show|help|-h|--help)(?=[\s"]|$))(?=[\s"]|$)'
decision = "ask_user"
priority = 90
denyMessage = "tamirs-superpowers permission policy: plugin-config.sh writes the permission policy, and `confirm` approves a pending widening, which only a host prompt may do (policy.edit, ADR 004 D5, D6). It is an R4 action (ADR 004), never automatic at any level: it needs your approval at a host prompt, so with no one at the terminal it is denied."

[[rule]]
# plugin-config-provision
# action: policy.edit (R4)
toolName = "run_shell_command"
commandRegex = '(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+|)(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+|)(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+|)(?:bash\s+|sh\s+|zsh\s+|)[^\s"]*plugin-config\.sh\s+provision(?=[\s"]|$)'
decision = "deny"
priority = 100
denyMessage = "tamirs-superpowers permission policy: `plugin-config.sh provision` is the CI writer (ADR 004 D6); it runs in a workflow step before the agent starts, never from an agent session."

[[rule]]
# host-config-cli
# action: policy.edit (R4)
toolName = "run_shell_command"
commandRegex = '(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+|)(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+|)(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+|)(?:[^\s"]*/|)(?:claude\s+plugin\s+configure|gemini\s+extensions\s+config)\b'
decision = "deny"
priority = 100
denyMessage = "tamirs-superpowers permission policy: a host config CLI writes the plugin's option store (policy.edit, ADR 004 D7, D10.3). Only the user changes plugin permission policy, guard files and host settings (ADR 004 D10): stop and ask them to make this change themselves, outside this session. Do not retry it through another tool, command or path."

[[rule]]
# protected-permission-files
# action: policy.edit (R4)
# mirrors: hooks/guard-sensitive-files.sh protected pass: the D3 permission file, lock, tickets and the project file.
toolName = ["write_file", "replace"]
argsPattern = '"file_path":"(?:[^"]*/|)(?:\.config/tamirs-superpowers/|\.local/state/tamirs-superpowers/|\.tamirs-superpowers/)'
decision = "deny"
priority = 100
denyMessage = "tamirs-superpowers permission policy: that is a permission policy file (policy.edit). Only the user changes plugin permission policy, guard files and host settings (ADR 004 D10): stop and ask them to make this change themselves, outside this session. Do not retry it through another tool, command or path."

[[rule]]
# protected-host-settings
# action: policy.edit (R4)
# mirrors: hooks/guard-sensitive-files.sh protected pass: host settings, policies, installed plugin caches and the extension .env (ADR 004 D10.1).
toolName = ["write_file", "replace"]
argsPattern = '"file_path":"(?:[^"]*/|)(?:\.claude/(?:plugins/cache/|settings[^/"]*\.json")|\.gemini/(?:settings\.json"|policies/|extensions/tamirs-superpowers/)|\.codex/(?:config\.toml"|hooks[^/"]*"|rules/|plugins/)|\.cursor/(?:hooks|cli-config|permissions)\.json"|\.config/(?:opencode|gh)/|\.gitconfig")'
decision = "deny"
priority = 100
denyMessage = "tamirs-superpowers permission policy: that is a host settings or plugin file (policy.edit). Only the user changes plugin permission policy, guard files and host settings (ADR 004 D10): stop and ask them to make this change themselves, outside this session. Do not retry it through another tool, command or path."

[[rule]]
# protected-git-config
# action: config.global.write (R4)
# mirrors: hooks/guard-sensitive-files.sh protected pass: {repo}/.git/hooks/** and {repo}/.git/config.
toolName = ["write_file", "replace"]
argsPattern = '"file_path":"(?:[^"]*/|)\.git/(?:hooks/|config")'
decision = "deny"
priority = 100
denyMessage = "tamirs-superpowers permission policy: .git/hooks and .git/config run code on later git calls (config.global.write). Only the user changes plugin permission policy, guard files and host settings (ADR 004 D10): stop and ask them to make this change themselves, outside this session. Do not retry it through another tool, command or path."

[[rule]]
# github-mcp-excluded
# action: pr.merge, repo.delete, repo.create (R4)
# mirrors: ADR 004 D8 GitHub MCP server flags: excluded at every level. pr.merge is R3 and never automatic; the repository tools are R4.
toolName = ["merge_pull_request", "delete_repository", "create_repository", "fork_repository"]
mcpName = "github"
decision = "deny"
priority = 100
denyMessage = "tamirs-superpowers permission policy: this GitHub MCP tool is excluded at every level (ADR 004 D8). The only automatic merge is `gh pr merge --auto`, and repository creation and deletion ask on the gh path."

[[rule]]
# github-mcp-unverified-matcher
# action: file.write.remote, workflow.edit, issue.edit, issue.close, pr.close, pr.review.approve (R4)
# mirrors: ADR 004 D8 GitHub MCP server flags: tools whose arguments can reach R3/R4 stay excluded until the platform's MCP hook matcher is verified live. On Gemini permission-guard.sh is wired to this server's tools (BeforeTool on mcp_github_<tool>, which gemini-wrap.sh maps to the Claude tool names), but that it fires for an extension server's tools is source-read (0.60.0), not measured, and hooks can be disabled; this static deny holds either way. r is the highest level the arguments can reach.
toolName = ["create_or_update_file", "push_files", "delete_file", "issue_write", "update_pull_request", "pull_request_review_write"]
mcpName = "github"
decision = "deny"
priority = 100
denyMessage = "tamirs-superpowers permission policy: on Gemini this GitHub MCP tool is excluded at every level (ADR 004 D8): its arguments can reach R3/R4, and the permission guard's hook on this server's tools is not yet verified live, so this static rule decides. The same change through the gh CLI is checked by the permission guard."
