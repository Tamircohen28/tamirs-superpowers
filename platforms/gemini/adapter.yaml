# Adapter metadata — Gemini CLI (REFACTOR-SPEC §21).
# Thin pointer file. Authoritative capabilities: core/capabilities/platforms.json.
id: gemini
display_name: Gemini CLI
registry_key: gemini_cli

# Coarse summary only. `agents` is the registry's `subagents` key.
capabilities:
  skills: adapter
  agents: adapter
  hooks: unknown
  mcp: native

manifest: gemini-extension.json

# Generated files Gemini is pointed at. Never edit; regenerate.
generated:
  skills: .gemini/skills                                  # scripts/build-gemini-extension.sh
  agents: .gemini/agents                                  # scripts/build-gemini-extension.sh
  hooks: platforms/gemini/hooks.json                      # scripts/build-gemini-hooks.sh, from hooks/hooks.json;
                                                          # shipped at hooks/hooks.json in the gemini distribution
  policies: platforms/gemini/policies/tamirs-superpowers.toml   # scripts/build-gemini-hooks.sh, from policies.source.json
  portable_skills: .agents/skills                         # scripts/build-agents-skills.sh (the .gemini/skills alias)
  regenerate: bash scripts/build-gemini-extension.sh . && bash scripts/build-gemini-hooks.sh . && bash scripts/build-agents-skills.sh .
  check: bash scripts/build-gemini-extension.sh . --check && bash scripts/build-gemini-hooks.sh . --check && bash scripts/build-agents-skills.sh . --check

install:
  type: extension
  doc: docs/user/install/gemini.md

validation:
  command: bash scripts/check-gemini-adapter.sh

notes: >-
  Values measured against Gemini CLI 0.55.1 (skills, agents) and 0.64.0 (hooks file
  loading, settings, policies, install) with a probe extension and the installed bundle,
  not read from documentation. skills is `adapter`: Gemini discovers skills exactly one
  level below a skills root, so the canonical two-level skills/<domain>/<name>/ tree
  resolves to ZERO skills anywhere Gemini looks. scripts/build-gemini-extension.sh
  generates a flat symlink mirror at .gemini/skills/, and scripts/build-agents-skills.sh
  the same mirror at .agents/skills/ (Gemini's higher-precedence alias of the workspace
  tier, also read by Codex, Antigravity and Copilot); with both present in a clone, 0.64.0
  logs one 'Skill conflict detected ... overriding' line per skill and loads each once
  from .agents/skills/ — one per canonical skill, no error. agents is `adapter` for the same reason
  OpenCode's is: Gemini requires `tools` as an array of Gemini tool names and rejects the
  canonical Claude comma-string with `tools.0: Invalid tool name`, so .gemini/agents/ is
  generated too, with `model:` omitted. hooks stays `unknown` in the registry until a hook
  is observed FIRING; what changed is that this adapter now SHIPS hooks and policies:
  platforms/gemini/hooks.json is generated from hooks/hooks.json (PreToolUse->BeforeTool
  with matchers ^(replace|write_file)$ / ^(run_shell_command)$, PostToolUse->AfterTool,
  UserPromptSubmit->BeforeAgent, Stop->AfterAgent, PreCompact->PreCompress, SessionStart/
  SessionEnd/Notification by name; WorktreeCreate/WorktreeRemove/DirectoryAdded/
  StopFailure/SubagentStop dropped), every command running the unmodified canonical hook
  through hooks/gemini-wrap.sh, which translates write_file->Write, replace->Edit,
  run_shell_command->Bash (dir_path -> cwd) on the way in and the Claude answer into
  {decision:deny,reason} / {} / hookSpecificOutput.additionalContext or systemMessage on
  the way out, always exiting 0 because Gemini treats every non-zero exit but 1 as a deny.
  Measured on 0.64.0: an extension built with that file at hooks/hooks.json and
  policies/tamirs-superpowers.toml installs (`gemini extensions install <path> --consent
  --skip-settings`), lists with its MCP server and its GITHUB_PERSONAL_ACCESS_TOKEN setting,
  and keeps both files in the installed copy; the loader reads only the `hooks` object and
  hydrates ${extensionPath}. Firing was not observed (no API key, no interactive session),
  so the registry row is unchanged. Policies are deny-only by construction (the generator
  forces decision = deny; Gemini ignores allow in extension policies): force push, branch
  -D, and write_file/replace onto lockfiles, .yarn/releases/ and .github/workflows/. The
  token is a manifest `settings[]` entry with `sensitive: true` (OS keychain) and
  `envVar: GITHUB_PERSONAL_ACCESS_TOKEN`, set with `gemini extensions config
  tamirs-superpowers GITHUB_PERSONAL_ACCESS_TOKEN`; measured: settings values reach the
  extension's MCP servers only, not its hooks. Known limitation, not fixable from here: an
  extension installed from a bare git URL roots at the repo root, where hooks/hooks.json is
  the CLAUDE file (its ${CLAUDE_PLUGIN_ROOT} commands cannot run on Gemini) and agents/ is
  Claude-shaped (one `Invalid tool name` error per file); the gemini release tarball is the
  tree with the generated files in place. Gemini CLI itself was retired for consumer tiers
  on 2026-06-18 (Antigravity CLI is the successor: platforms/antigravity/); enterprise
  Code Assist and paid API-key users keep it, and this adapter keeps serving them.
