# capture.conf — Gemini CLI record for scripts/capture-config.sh.
# See platforms/claude/capture.conf for the field contract. Data only.
# shellcheck shell=bash

CAPTURE_NAME="gemini"
CAPTURE_DISPLAY="Gemini CLI"
CAPTURE_REGISTRY_KEY="gemini_cli"

CAPTURE_MODULES="gemini-md settings"

CAPTURE_PORTABLE='context.fileName
context.*
model*
general.*
ui.*
tools.core
tools.exclude
privacy.*'

CAPTURE_MACHINE_LOCAL='security.auth.*
selectedAuthType
telemetry.*
*.sandboxImage
projects.*
usageStatisticsEnabled'

# `.hooks` and every MCP entry belong to whoever wired them; setup.sh already
# refuses to touch either, and capture refuses to read them back.
CAPTURE_THIRD_PARTY_KEYS='hooks.*
mcpServers.*'

CAPTURE_SINKS="$(printf '%s\t%s\t%s\n' \
  gemini-md '*' core/global-rules.md \
  settings  '*' platforms/gemini/templates/settings.json)"
CAPTURE_SINK_CAPS="$(printf '%s\t%s\n' core/global-rules.md skill_auto_invocation)"
