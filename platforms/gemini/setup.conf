# setup.conf — Gemini CLI target record for scripts/setup.sh. See platforms/claude/setup.conf.
# shellcheck shell=bash

SETUP_NAME="gemini"
SETUP_DISPLAY="Gemini CLI"

SETUP_DETECT="gemini"
SETUP_CONFIG_DIR="${HOME}/.gemini"
SETUP_ENV_OVERRIDE="GEMINI_CONFIG_DIR"

SETUP_MARKER="tamirs-superpowers"
SETUP_WRITERS="setup-gemini.sh"
SETUP_STATUS="implemented"

# settings.json asserts `context.fileName` only; `.hooks` (cmux, gortex) and every
# MCP entry are left exactly as found.
SETUP_MODULES="gemini-md settings"
