# capture.conf — Cursor record for scripts/capture-config.sh.
# See platforms/claude/capture.conf for the field contract. Data only.
# shellcheck shell=bash

CAPTURE_NAME="cursor"
CAPTURE_DISPLAY="Cursor"
CAPTURE_REGISTRY_KEY="cursor"

CAPTURE_MODULES="rules cli-config"

CAPTURE_PORTABLE='permissions.allow
permissions.deny
model*
editor.*
version'

CAPTURE_MACHINE_LOCAL='projects.*
*.workspacePath
installationId
machineId
lastUpdate*'

# ~/.cursor/hooks.json is not ours and is not a setup module; the key path is
# listed anyway so a hook that migrated into cli-config.json is still refused.
CAPTURE_THIRD_PARTY_KEYS='hooks.*
mcpServers.*'

CAPTURE_SINKS="$(printf '%s\t%s\t%s\n' \
  rules      '*' core/global-rules.md \
  cli-config '*' platforms/cursor/templates/cli-config.json)"
CAPTURE_SINK_CAPS="$(printf '%s\t%s\n' core/global-rules.md skill_auto_invocation)"
