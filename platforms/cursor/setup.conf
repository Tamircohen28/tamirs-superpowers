# setup.conf — Cursor target record for scripts/setup.sh. See platforms/claude/setup.conf.
# shellcheck shell=bash

SETUP_NAME="cursor"
SETUP_DISPLAY="Cursor"

SETUP_DETECT="cursor-agent"
SETUP_CONFIG_DIR="${HOME}/.cursor"
SETUP_ENV_OVERRIDE="CURSOR_CONFIG_DIR"

SETUP_MARKER="tamirs-superpowers"
SETUP_WRITERS=""
# Phase 3 fills these in: ~/.cursor/rules/*.mdc (global) + a merge into cli-config.json.
# Declared empty on purpose — `plan` reports "no modules implemented yet" rather
# than showing an empty target and letting the reader assume it is up to date.
SETUP_STATUS="not-yet-implemented"
SETUP_MODULES=""
