# setup.conf — Cursor target record for scripts/setup.sh. See platforms/claude/setup.conf.
# shellcheck shell=bash

SETUP_NAME="cursor"
SETUP_DISPLAY="Cursor"

SETUP_DETECT="cursor-agent"
SETUP_CONFIG_DIR="${HOME}/.cursor"
SETUP_ENV_OVERRIDE="CURSOR_CONFIG_DIR"

SETUP_MARKER="tamirs-superpowers"
SETUP_WRITERS="setup-cursor.sh"
SETUP_STATUS="implemented"

# No hooks module: cmux owns ~/.cursor/hooks.json and the Claude-shaped hook
# bundle does not run under Cursor at all (capability registry: hooks=partial).
SETUP_MODULES="rules cli-config"
