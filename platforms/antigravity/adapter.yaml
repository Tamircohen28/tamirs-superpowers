# Adapter metadata — Antigravity CLI (REFACTOR-SPEC §21).
# Thin pointer file. Authoritative capabilities: core/capabilities/platforms.json.
id: antigravity
display_name: Antigravity CLI
registry_key: antigravity_cli

# The registry lists antigravity_cli under the gemini platform with
# `support: unverified` and no capability block: no live `agy` run has recorded
# anything, and the CLI is not open source, so nothing could be read from a
# bundle the way the Gemini rows were. Every coarse key here is therefore
# `unknown`, deliberately — not `unsupported`, which would assert a measured
# failure. `agents` is the registry's `subagents` key.
support: unverified
capabilities:
  skills: unknown
  agents: unknown
  hooks: unknown
  mcp: unknown

# Generated files. Never edit; regenerate.
manifest: platforms/antigravity/plugin.json
generated:
  plugin: platforms/antigravity/plugin.json        # scripts/build-antigravity-plugin.sh
  mcp: platforms/antigravity/mcp_config.json       # scripts/build-antigravity-plugin.sh
  regenerate: bash scripts/build-antigravity-plugin.sh .
  check: bash scripts/build-antigravity-plugin.sh . --check

install:
  type: path
  doc: docs/user/install/antigravity.md

validation:
  command: bash tests/test-antigravity-adapter.sh

notes: >-
  Antigravity CLI (`agy`) replaced Gemini CLI for consumer tiers on 2026-06-18;
  Gemini CLI stays available to enterprise Code Assist and paid API-key users, and
  the gemini adapter keeps serving them. A native Antigravity plugin is a folder:
  plugin.json (closed schema: name + description, additionalProperties false),
  optional mcp_config.json and hooks.json, and skills/<name>/SKILL.md,
  agents/<name>.md, rules/<name>.md beside them; workspace plugins live in
  .agents/plugins/, global in ~/.gemini/config/plugins/, CLI installs are staged at
  ~/.gemini/antigravity-cli/plugins/<name>/. This adapter generates plugin.json and
  mcp_config.json and deliberately ships NO hooks.json: Google states hooks carry
  over from Gemini extensions without 1:1 parity and one third-party source says
  agy loads hooks but does not fire them; a hooks file that loads and never fires
  reads as a guard that is not one. The migration route is `agy plugin import
  gemini` from an installed Gemini extension, which converts commands to skills,
  moves workspace skills to .agents/skills/ (this repo now ships that tree,
  generated by scripts/build-agents-skills.sh) and MCP to mcp_config.json. Two
  things are recorded as unverified rather than claimed: whether a relative stdio
  command path in mcp_config.json resolves against the plugin directory (the docs
  show only absolute paths and no placeholder), and whether the import preserves
  hooks/hooks.json and policies/*.toml. A live `agy` run is the only thing that
  moves any row here off unknown.
