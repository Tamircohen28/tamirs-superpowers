# setup.conf — Claude Code target record for scripts/setup.sh.
#
# SOURCED, NOT PARSED. bash 3.2 has no associative arrays, so the registry is a
# file per target rather than a table: adding a platform is adding this file plus
# a scripts/lib/setup-<name>.sh, never editing the engine.
#
# Data only — no logic, no functions. The writers live in SETUP_WRITERS so that
# `make lint` shellchecks them (the lint recipe globs *.sh).
#
# shellcheck shell=bash

SETUP_NAME="claude"
SETUP_DISPLAY="Claude Code"

# Detection, in this order: binary on PATH, then config dir exists. Never a menu.
SETUP_DETECT="claude"
SETUP_CONFIG_DIR="${HOME}/.claude"
SETUP_ENV_OVERRIDE="CLAUDE_CONFIG_DIR"

SETUP_MARKER="tamirs-superpowers"
SETUP_WRITERS="setup-claude.sh"
SETUP_STATUS="implemented"

# Module order is apply order. `settings` runs first so the later settings.json
# modules render on top of the merged base rather than the user's raw file.
SETUP_MODULES="settings plugins statusline agents claude-md notifications-creds notifications-hook exit-guard"
