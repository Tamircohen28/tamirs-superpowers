# capture.conf — Claude Code record for scripts/capture-config.sh.
#
# SOURCED, NOT PARSED — the same rule as setup.conf next to it. Data only: no
# logic, no functions, no command substitution. Adding a platform to capture is
# adding this file, never editing the engine.
#
# WHAT IT ADDS OVER setup.conf
#   setup.conf answers "where does this platform keep its config and who writes
#   it". capture.conf answers the three questions that only matter in the
#   machine -> repo direction:
#     1. which key paths are POLICY (portable, worth carrying to every machine)
#     2. which are MACHINE STATE (true here only, never in the repo)
#     3. where an adopted hunk lands in the canonical source
#
#   Anything matching neither list is `unknown` and is ASKED about. That default
#   is deliberate: a silent guess in this direction is how a machine path or a
#   third party's wiring ends up committed.
#
# shellcheck shell=bash

CAPTURE_NAME="claude"
CAPTURE_DISPLAY="Claude Code"
CAPTURE_REGISTRY_KEY="claude_code"

# The modules capture reads, a subset of setup.conf's SETUP_MODULES. `agents` is
# a directory sync and `notifications-creds` is a credentials file — neither has
# anything a person hand-edits that belongs in the repo.
CAPTURE_MODULES="settings plugins claude-md"

# --- portable: policy that should be true on every machine ------------------
CAPTURE_PORTABLE='permissions.allow
permissions.ask
permissions.deny
permissions.defaultMode
permissions.additionalDirectories
model
effortLevel
theme
tui
defaultMode
autoMode.*
skillOverrides.*
enabledPlugins.*
disableClaudeAiConnectors
disabledMcpjsonServers
enableAllProjectMcpServers
alwaysThinkingEnabled
includeCoAuthoredBy
cleanupPeriodDays
outputStyle
spinnerTipsEnabled
statusLine.type
env.*
$schema'

# --- machine-local: true here only ------------------------------------------
# `extraKnownMarketplaces.*.source.path` is the concrete case this list exists
# for: a marketplace installed from a local directory renders to a path that
# does not exist on any other machine. The repo already documents that exclusion
# by hand in settings.d/marketplaces.json; here it is enforced.
CAPTURE_MACHINE_LOCAL='extraKnownMarketplaces.*.source.path
extraKnownMarketplaces.*.source.source
projects.*
userID
oauthAccount.*
firstStartTime
installMethod
autoUpdates
hasCompletedOnboarding
hasSeen*
lastReleaseNotesSeen
lastOnboardingVersion
feedbackSurveyState.*
tipsHistory.*
promptQueueUseCount
subscriptionNoticeCount
cachedChangelog*
changelogLastFetched
fallbackAvailableWarningThreshold
statusLine.command
customApiKeyResponses.*
*.path
*Dir
*Directory'

# --- foreign-owned key paths ------------------------------------------------
# Hook entries are shared ground: this repo writes one Notification hook and
# other tools write their own into the same array. Ownership there is decided
# per value by capture_third_party_reason, not by the key path, so only the
# blanket third-party surfaces are listed here.
CAPTURE_THIRD_PARTY_KEYS='mcpServers.*
hooks.*.hooks.*.command'

# --- sinks: <module> <keypath-glob> <repo-relative-file>, tab separated ------
# Written through `printf '%s\t%s\t%s\n'` rather than as literal strings: a
# `\t` inside single quotes is two characters, not a tab, and the reader that
# splits on IFS=tab would then see one field and silently match nothing.
#
# FIRST MATCH WINS, so the specific rows come before `permissions.*`. Fragment
# choice mirrors what each settings.d file already holds, so a captured
# permission joins the fifty already there instead of starting a sixth file.
CAPTURE_SINKS="$(printf '%s\t%s\t%s\n' \
  settings permissions.ask            platforms/claude/settings.d/permissions-ask.json \
  settings permissions.deny           platforms/claude/settings.d/misc.json \
  settings permissions.defaultMode    platforms/claude/settings.d/defaults.json \
  settings 'permissions.*'            platforms/claude/settings.d/permissions-allow.json \
  settings 'extraKnownMarketplaces*'  platforms/claude/settings.d/marketplaces.json \
  settings 'autoMode*'                platforms/claude/settings.d/auto-mode.json \
  settings model                      platforms/claude/settings.d/defaults.json \
  settings effortLevel                platforms/claude/settings.d/defaults.json \
  settings theme                      platforms/claude/settings.d/defaults.json \
  settings tui                        platforms/claude/settings.d/defaults.json \
  settings defaultMode                platforms/claude/settings.d/defaults.json \
  settings '$schema'                  platforms/claude/settings.d/defaults.json \
  settings '*'                        platforms/claude/settings.d/misc.json \
  plugins  '*'                        platforms/claude/settings.d/plugins.json \
  claude-md '*'                       core/global-rules.md)"

# Capability cited when an adopted hunk does not reach another platform.
# DELIBERATELY WITHOUT A ROW for the settings.d sinks: core/capabilities/ has no
# id for per-tool permission policy, and citing a near-miss id would be a false
# explanation. With no row the report says plainly that the platform has no
# equivalent — which is the true statement.
CAPTURE_SINK_CAPS="$(printf '%s\t%s\n' core/global-rules.md skill_auto_invocation)"
