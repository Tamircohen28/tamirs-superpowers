<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">scaffold-gold</title>
  <desc id="d">Motif: three stacked contract gates, each carrying a check mark, feeding a rising bar of passed checks — the app-gold profile's P1/P2/P3 exit gate rendered as depth-layered panels over a circuit grid.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#111726"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D9A6C"/>
      <stop offset="1" stop-color="#0E5C6B"/>
    </linearGradient>
    <linearGradient id="panel2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12796B"/>
      <stop offset="1" stop-color="#0B3F55"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0E5C6B"/>
      <stop offset="1" stop-color="#3DDC97"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- circuit grid: the substrate every check runs over -->
  <g stroke="#1B2434" stroke-width="1" fill="none" opacity="0.75">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200"/>
    <path d="M120 0 V400 M280 0 V400 M440 0 V400 M760 0 V400 M920 0 V400 M1080 0 V400"/>
    <path d="M120 160 H200 V240 H280"/>
    <path d="M920 80 H1000 V200 H1080"/>
  </g>
  <circle cx="200" cy="160" r="4" fill="#22303F"/>
  <circle cx="1000" cy="200" r="4" fill="#22303F"/>

  <ellipse cx="880" cy="200" rx="260" ry="170" fill="url(#glow)" filter="url(#soft)"/>

  <!-- three stacked gates, back to front -->
  <g>
    <rect x="806" y="86" width="230" height="150" rx="20" fill="url(#panel2)" opacity="0.45" transform="rotate(-8 921 161)"/>
    <rect x="836" y="116" width="230" height="150" rx="20" fill="url(#panel2)" opacity="0.7" transform="rotate(-4 951 191)"/>
    <rect x="866" y="146" width="230" height="150" rx="20" fill="url(#panel)"/>
    <rect x="866" y="146" width="230" height="14" rx="7" fill="#3DDC97" opacity="0.55"/>
    <path d="M916 224 l24 26 l52 -62" fill="none" stroke="#04120D" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
    <path d="M916 220 l24 26 l52 -62" fill="none" stroke="#EAFFF6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- rising bars: P1 / P2 / P3 driven to zero -->
  <g>
    <rect x="700" y="286" width="26" height="44" rx="6" fill="url(#bar)" opacity="0.55"/>
    <rect x="740" y="256" width="26" height="74" rx="6" fill="url(#bar)" opacity="0.75"/>
    <rect x="780" y="216" width="26" height="114" rx="6" fill="url(#bar)"/>
    <line x1="686" y1="336" x2="1110" y2="336" stroke="#22303F" stroke-width="2"/>
  </g>

  <!-- accent rule under the wordmark -->
  <rect x="96" y="232" width="112" height="5" rx="2.5" fill="url(#bar)"/>

  <text x="96" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#E6EDF3">scaffold-gold</text>
  <text x="96" y="278" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#8B949E">Contract gold fixture — app-gold profile</text>
</svg>
