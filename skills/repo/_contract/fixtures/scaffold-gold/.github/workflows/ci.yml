name: CI

on:
  # NO branch-name filter, deliberately. `on.push.branches` cannot take a
  # dynamic default-branch token — workflow triggers are parsed before any
  # context exists, so `github.event.repository.default_branch` is unavailable
  # here. Enumerating names (`[main]`, `[master]`, or both) is how a workflow
  # silently never runs on a repo whose default is spelled differently.
  # Running on every push and every PR is the only spelling that cannot be
  # wrong; gate on the default branch at JOB level, where the context exists:
  #   if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
  push:
  pull_request:

# Supersede obsolete runs of THIS workflow only. `github.workflow` in the key is
# load-bearing — without it every workflow for a PR shares one group and a newly
# started workflow cancels an unrelated one that was already running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for high-signal secret patterns
        run: |
          if grep -rE '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})' --include='*.json' --include='*.yml' .; then
            exit 1
          fi
          echo "No secrets found"
